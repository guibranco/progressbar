# Self-hosted deployment (Vercel does not use this file).
#
#   docker compose up -d --build
#
# gunicorn is published on 127.0.0.1:8099 of the host (the port NGINX, the
# deploy scripts and the health checks all expect); put NGINX in front of it
# (see deploy/nginx/) for TLS and response caching.
services:
  progressbar:
    build: .
    image: progressbar:local
    container_name: progressbar
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8099"
    env_file:
      - path: ./deploy/env
        required: false
    environment:
      # Connections arrive from the Docker bridge, not from 127.0.0.1, so the
      # reverse proxy's X-Forwarded-* headers are trusted from any peer. The
      # port is bound to the host loopback only, so only host-local processes
      # can reach it (and could therefore spoof those headers).
      PROGRESSBAR_FORWARDED_ALLOW_IPS: "*"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
