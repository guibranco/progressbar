name: Deploy (self-hosted)

# Redeploys the self-hosted instance (deploy/) after CI succeeds on main.
#
# Opt-in: nothing runs until the repository variable SELF_HOST_DEPLOY is "true"
# and these secrets exist:
#   DEPLOY_SSH_HOST         VM hostname or IP
#   DEPLOY_SSH_USER         SSH user (owns APP_DIR, member of the docker group)
#   DEPLOY_SSH_KEY          private key (ed25519) authorised for that user
#   DEPLOY_SSH_KNOWN_HOSTS  output of `ssh-keyscan -H <host>` (pins the host key)
#   DEPLOY_SSH_PORT         optional, default 22
# Optional repository variable SELF_HOST_APP_DIR (default /opt/progressbar/app).
#
# The workflow never checks out or runs pull-request code: it only tells the VM
# to deploy the exact commit whose CI run succeeded (deploy/update.sh).
# The Vercel deployment is independent of this workflow.

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-self-hosted
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        name: Deploy to VM
        if: >-
            vars.SELF_HOST_DEPLOY == 'true' &&
            (github.event_name == 'workflow_dispatch' ||
             (github.event.workflow_run.conclusion == 'success' &&
              github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.head_branch == 'main'))
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Deploy over SSH
              env:
                  SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
                  SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
                  SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
                  APP_DIR: ${{ vars.SELF_HOST_APP_DIR || '/opt/progressbar/app' }}
                  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  set -euo pipefail
                  for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS; do
                    [ -n "${!v}" ] || { echo "::error::missing secret for $v"; exit 1; }
                  done
                  [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid SELF_HOST_APP_DIR"; exit 1; }
                  [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit sha"; exit 1; }
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
                  echo "Deploying $DEPLOY_SHA to $SSH_HOST:$APP_DIR"
                  # Bring the checkout to the target commit first so the update
                  # script that runs is the one from that commit.
                  ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                    -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
                    "$SSH_USER@$SSH_HOST" \
                    "cd '$APP_DIR' && git fetch --prune origin main && git checkout -q main && git reset -q --hard '$DEPLOY_SHA' && APP_DIR='$APP_DIR' BRANCH=main DEPLOY_SHA='$DEPLOY_SHA' ./deploy/update.sh"
