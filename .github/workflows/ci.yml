name: CI

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-tests:
        name: Build and Test
        runs-on: ubuntu-latest
        outputs:
            semVer: ${{ steps.gitversion.outputs.semVer }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4
              with:
                  versionSpec: '6.x'

            - name: Determine Version
              id: gitversion
              uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: "3.11"
            - name: Cache pip dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
                restore-keys: |
                  ${{ runner.os }}-pip-
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
      
            - name: Run linting
              run: |
                pip install flake8
                flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

            - name: Run tests
              run: |
                pip install pytest
                pytest test_api.py

    docker-image:
        name: Docker image
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Build image
              run: docker build -t progressbar:ci .

            - name: Smoke test
              run: |
                set -euo pipefail
                docker run -d --name progressbar -p 127.0.0.1:8099:8099 progressbar:ci
                for i in $(seq 1 20); do
                  curl -fsS --max-time 2 http://127.0.0.1:8099/health && break
                  [ "$i" -lt 20 ] || { echo "::error::/health never became ready"; docker logs progressbar; exit 1; }
                  sleep 2
                done
                headers=$(curl -fsS -D - -o /dev/null "http://127.0.0.1:8099/58/?title=ci&style=plastic")
                echo "$headers"
                grep -qi "^content-type: image/svg+xml" <<<"$headers"
                grep -qi "^cache-control: public, max-age=86400" <<<"$headers"
                [ "$(docker inspect --format '{{.Config.User}}' progressbar)" = "progressbar" ]
                docker rm -f progressbar

    create_release:
        name: Create release
        needs: [build-tests, docker-image]
        env:
            SEMVER: ${{ needs.build-tests.outputs.semVer }}
        runs-on: ubuntu-latest

        steps:
            - name: Create Release
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  skipIfReleaseExists: true
                  allowUpdates: false
                  draft: false
                  makeLatest: true
                  tag: v${{ env.SEMVER }}
                  name: Release v${{ env.SEMVER }}
                  generateReleaseNotes: true
                  body: Release ${{ env.SEMVER }} of ${{ github.repository }}
