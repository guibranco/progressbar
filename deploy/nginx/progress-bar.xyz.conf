# ProgressBar badge service: reverse proxy + response cache in front of gunicorn.
#
# Install (deploy/install.sh does this for you):
#   cp deploy/nginx/progressbar-cache.conf /etc/nginx/conf.d/
#   cp deploy/nginx/progress-bar.xyz.conf  /etc/nginx/sites-available/progress-bar.xyz
#   ln -s /etc/nginx/sites-available/progress-bar.xyz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d progress-bar.xyz      # adds the HTTPS server block
#
# Why cache here: the app marks /<n>/ as cacheable for a day (the SVG is a pure
# function of the URL) and /dynamic/json/ for 5 minutes by default, so the
# Python process only runs for cache misses. Errors and /health are no-store.

upstream progressbar_app {
    server 127.0.0.1:8099;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name progress-bar.xyz;

    access_log /var/log/nginx/progress-bar.xyz.access.log;
    error_log  /var/log/nginx/progress-bar.xyz.error.log;

    # Liveness probe for uptime monitors: bypasses the cache, keeps logs quiet.
    location = /health {
        access_log off;
        proxy_pass http://progressbar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://progressbar_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;

        # Response cache. NGINX honours the app's Cache-Control (max-age,
        # no-store, stale-while-revalidate); proxy_cache_valid is only the
        # fallback for responses without one.
        proxy_cache            progressbar;
        proxy_cache_key        "$scheme$host$request_uri";
        proxy_cache_valid      200 5m;
        proxy_cache_lock       on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
