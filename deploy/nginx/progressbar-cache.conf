# Cache zone for ProgressBar responses. Must live in the `http` context:
#   /etc/nginx/conf.d/progressbar-cache.conf
#
# 200 MB holds roughly 100k distinct badge URLs (~1.8 KB each); entries not
# requested for 7 days are evicted.
proxy_cache_path /var/cache/nginx/progressbar
                 levels=1:2
                 keys_zone=progressbar:10m
                 max_size=200m
                 inactive=7d
                 use_temp_path=off;
