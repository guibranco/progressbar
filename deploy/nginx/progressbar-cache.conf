# http-context settings for the ProgressBar vhost:
#   /etc/nginx/conf.d/progressbar-cache.conf
#
# Cache zone: 200 MB holds roughly 100k distinct badge URLs (~1.8 KB each);
# entries not requested for 7 days are evicted. NGINX creates the directory
# itself and chowns it to the worker user.
proxy_cache_path /var/cache/nginx/progressbar
                 levels=1:2
                 keys_zone=progressbar:10m
                 max_size=200m
                 inactive=7d
                 use_temp_path=off;

# Access-log format WITHOUT the query string ($uri instead of $request):
# /dynamic/json/ takes the remote document address as a query parameter and
# callers may embed tokens in it, which must not end up in the logs.
log_format progressbar_noquery '$remote_addr - [$time_local] '
                               '"$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent $upstream_cache_status '
                               '"$http_referer" "$http_user_agent"';
